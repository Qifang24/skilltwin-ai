server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 20m;

    # Keep browser and API on one origin. This avoids a public CORS dependency.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    # Useful for an evaluator on a protected deployment; do not expose these publicly
    # unless the host is protected by authentication or network access rules.
    location = /docs { proxy_pass http://backend:8000/docs; }
    location = /redoc { proxy_pass http://backend:8000/redoc; }
    location = /openapi.json { proxy_pass http://backend:8000/openapi.json; }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
